# ShellCheck の結果を SARIF で Code scanning（Security タブ）へ連携する。
# CodeQL は Bash を直接サポートしないため、CI（ci.yml）で既にゲートしている ShellCheck を
# Security タブにも上げて可視化する。失敗ゲートは ci.yml 側の `shellcheck -x`（全ファイル）が
# 担い、本ワークフローは push 時にフルスキャンして SARIF を上げ、新規欠陥のみで失敗する。
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  shellcheck-sarif:
    name: ShellCheck (SARIF -> Code scanning)
    runs-on: ubuntu-latest
    steps:
      # 実際に動く commit は .github/workflows/actions.lock が固定する（タグ付け替えを防ぐ）。
      # uses: を変えたら gh actions-lock を流し直す。版の更新は Dependabot が lockfile ごと PR で運ぶ。
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # push ではフル、pull_request では差分をスキャンし、SARIF を Code scanning へ
      # アップロードする。external-sources は既定 true（ci.yml の `-x` と整合）。
      # 完全な版のタグ（@v5.5.7）と lockfile で固定するので、同梱 shellcheck の版更新も Dependabot の
      # PR として見える（@v5 のような可動タグだと版が黙って動き、PR が出ない）。
      # 同梱のコンテナイメージは digest で固定されていないため、lockfile の対象外（gh actions-lock が警告する）。
      - name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@v5.5.7
        with:
          severity: style
          token: ${{ secrets.GITHUB_TOKEN }}
